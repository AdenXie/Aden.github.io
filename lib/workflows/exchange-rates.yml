name: Refresh official BOC exchange quote
on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: boc-exchange-collector
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: source
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Collect directly from official BOC sources
        run: node tools/collect-exchange.cjs "$RUNNER_TEMP/aud-cny.json"
      - name: Save durable quote without rebuilding the blog
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/exchange-rates" >/dev/null 2>&1; then
            gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref=refs/heads/exchange-rates -f sha="$GITHUB_SHA" >/dev/null
          fi
          export QUOTE_SHA="$(gh api "repos/$GITHUB_REPOSITORY/contents/aud-cny.json?ref=exchange-rates" --jq .sha 2>/dev/null || true)"
          node -e 'const fs=require("fs"); const p={message:"data: refresh official BOC quote",branch:"exchange-rates",content:fs.readFileSync(process.env.RUNNER_TEMP+"/aud-cny.json").toString("base64")}; if(process.env.QUOTE_SHA)p.sha=process.env.QUOTE_SHA;fs.writeFileSync(process.env.RUNNER_TEMP+"/quote-request.json",JSON.stringify(p));'
          gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/aud-cny.json" --input "$RUNNER_TEMP/quote-request.json" >/dev/null
