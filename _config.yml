# Site
title: The Aden Family
subtitle: 科技、体验与个人判断
description: Aden 的个人科技博客，记录设备体验、系统折腾与技术观察。
keywords:
  - 科技
  - 数码
  - 设备体验
  - 系统教程
  - AdenXie
author: AdenXie
language: zh-CN
timezone: Asia/Shanghai

# URL
url: https://blog.adenxie.com.cn
root: /
permalink: :year/:month/:day/:title/
permalink_defaults:
pretty_urls:
  trailing_index: true
  trailing_html: true

# Directories
source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang
skip_render:

# Writing
new_post_name: :title.md
default_layout: post
titlecase: false
external_link:
  enable: true
  field: site
  exclude: ''
filename_case: 0
render_drafts: false
post_asset_folder: false
relative_link: false
future: true
syntax_highlighter: highlight.js
highlight:
  line_number: true
  auto_detect: false
  tab_replace: ''
  wrap: true
  hljs: true

# Home
index_generator:
  path: ''
  per_page: 8
  order_by: -date

# Taxonomy
default_category: uncategorized
category_map:
tag_map:

# Metadata and dates
meta_generator: true
date_format: YYYY-MM-DD
time_format: HH:mm:ss
updated_option: empty

# Pagination
per_page: 8
pagination_dir: page

# Local search
search:
  path: search.xml
  field: all
  content: true
  format: html

# Theme
theme: redefine

# Deployment
deploy:
  type: git
  repository: https://github.com/AdenXie/Aden.github.io.git
  branch: main

