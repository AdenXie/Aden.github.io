name: Build and deploy Hexo

on:
  push:
    branches:
      - source
    paths:
      - source/**
      - _config.yml
      - _config.redefine.yml
      - package.json
      - package-lock.json
      - .github/workflows/deploy.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hexo-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out source branch
        uses: actions/checkout@v4
        with:
          ref: source
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run clean && npm run build

      - name: Publish generated site to main
        env:
          DEPLOY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --global url."https://x-access-token:${DEPLOY_TOKEN}@github.com/".insteadOf "https://github.com/"
          npm run deploy
