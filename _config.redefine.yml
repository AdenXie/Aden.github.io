info:
  title: The Aden Family
  subtitle: 科技、体验与个人判断
  author: AdenXie
  url: https://blog.adenxie.com.cn

defaults:
  favicon: /images/favicon.png
  logo:
  avatar: /images/avatar.jpg

colors:
  primary: "#F2E94E"
  secondary: "#18D5E8"
  default_mode: dark

global:
  fonts:
    chinese:
      enable: false
      family:
      url:
    english:
      enable: false
      family:
      url:
    title:
      enable: false
      family:
      url:
  content_max_width: 1080px
  sidebar_width: 230px
  hover:
    shadow: true
    scale: false
  scroll_progress:
    bar: true
    percentage: true
  website_counter:
    enable: false
    site_pv: false
    site_uv: false
    post_pv: false
  single_page: true
  preloader:
    enable: false
    custom_message:
  side_tools:
    gear_rotation: false
    auto_expand: false
  open_graph:
    enable: true
    image: /images/home-hero.jpg
    description: Aden 的个人科技博客，记录设备体验、系统折腾与技术观察。
  google_analytics:
    enable: false
    id:

home_banner:
  enable: true
  style: static
  image:
    light: /images/home-hero.jpg
    dark: /images/home-hero.jpg
  title: The Aden Family
  subtitle:
    text:
      - 科技、体验与个人判断
      - 写下真实体验，也保留观点的棱角
    hitokoto:
      enable: false
      show_author: false
      api: https://v1.hitokoto.cn
    typing_speed: 85
    backing_speed: 45
    starting_delay: 350
    backing_delay: 2200
    loop: true
    smart_backspace: true
  text_color:
    light: "#FFFFFF"
    dark: "#FFFFFF"
  text_style:
    title_size: 3.4rem
    subtitle_size: 1.15rem
    line_height: 1.35
  custom_font:
    enable: false
    family:
    url:
  social_links:
    enable: true
    style: default
    links:
      - icon: github
        url: https://github.com/AdenXie
      - icon: youtube
        url: https://www.youtube.com/@adenxie2847
      - icon: twitter
        url: https://x.com/aden_xie
    qrs: []

navbar:
  auto_hide: false
  color:
    left: "#070A0F"
    right: "#111923"
    transparency: 8
  width:
    home: 1240px
    pages: 1080px
  links:
    归档:
      path: /archives/
      icon: fa-regular fa-box-archive
    标签:
      path: /tags/
      icon: fa-regular fa-tags
    关于:
      path: /about/
      icon: fa-regular fa-user
    友链:
      path: /link/
      icon: fa-regular fa-link
  search:
    enable: true
    preload: true

home:
  sidebar:
    enable: true
    position: left
    first_item: info
    announcement: 记录设备体验、系统折腾与技术观察。
    show_on_mobile: true
    links:
      文章归档:
        path: /archives/
        icon: fa-regular fa-box-archive
      主题标签:
        path: /tags/
        icon: fa-regular fa-tags
      关于 Aden:
        path: /about/
        icon: fa-regular fa-user
  article_date_format: YYYY-MM-DD
  excerpt_length: 180
  categories:
    enable: false
    limit: 3
  tags:
    enable: true
    limit: 3

articles:
  style:
    font_size: 17px
    line_height: 1.85
    image_border_radius: 10px
    image_alignment: center
    image_caption: true
    link_icon: true
    delete_mask: false
    title_alignment: left
    headings_top_spacing:
      h1: 3.2rem
      h2: 2.5rem
      h3: 2rem
      h4: 1.7rem
      h5: 1.5rem
      h6: 1.35rem
  word_count:
    enable: true
    count: true
    min2read: true
  author_label:
    enable: false
    auto: false
    list: []
  code_block:
    copy: true
    style: simple
    highlight_theme:
      light: github
      dark: github-dark
    font:
      enable: false
      family:
      url:
  toc:
    enable: true
    max_depth: 3
    number: false
    expand: true
    init_open: true
  copyright:
    enable: true
    default: all_rights_reserved
  lazyload: true
  pangu_js: false
  recommendation:
    enable: false
    title: 推荐阅读
    limit: 3
    mobile_limit: 2
    placeholder: /images/home-hero.jpg
    skip_dirs: []

comment:
  enable: false
  system: giscus
  config: {}

footer:
  runtime: true
  icon: '<i class="fa-solid fa-bolt" style="color: #F2E94E"></i>'
  start: 2021/08/01 00:00:00
  statistics: true
  customize: 写下真实体验，也保留观点的棱角。
  icp:
    enable: false
    number:
    url:

inject:
  enable: true
  head:
    - '<link rel="stylesheet" href="/css/custom.css">'
  footer: []

plugins:
  feed:
    enable: false
  aplayer:
    enable: false
    type: fixed
    audios: []
  mermaid:
    enable: false
    version: "11.4.1"
    theme:
      light: default
      dark: dark

page_templates:
  friends_column: 2
  tags_style: blur
  masonry:
    batch_size: 12
    initial_batch_size: 24

cdn:
  enable: false
  provider: npmmirror
  custom_url:

developer:
  enable: false
